# Builds a release and publishes it, which is what the in-app update check
# looks at. Runs when a v* tag is pushed, or on demand with a version given.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.0.0). Must match src/version.h. The tag is created by this run.'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim().TrimStart('v')
          } else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "'$version' is not a three-part version number."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # An update the program cannot recognise as installed would be offered
      # again on every check, so the tag and the built-in version must agree.
      - name: Check the version in the source matches
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $actual = (Select-String -Path src/version.h -Pattern 'DM_VERSION_STRING L"([^"]+)"').Matches[0].Groups[1].Value
          if ($actual -ne $expected) {
            throw "src/version.h says $actual but this release is $expected. Bump src/version.h, src/app.rc and installer/DisplayMirror.nsi first."
          }

      # The generator is not hard-coded: windows-latest moves to a new Visual
      # Studio every so often, and naming one version is what broke this. Try
      # the known generators newest first, then fall back to whatever CMake
      # picks for itself.
      - name: Configure
        shell: pwsh
        run: |
          $generators = @('Visual Studio 18 2026', 'Visual Studio 17 2022')
          $configured = $false
          foreach ($generator in $generators) {
            Write-Host "Trying generator: $generator"
            cmake -S . -B build -G $generator -A x64
            if ($LASTEXITCODE -eq 0) { $configured = $true; break }
            Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          }
          if (-not $configured) {
            Write-Host 'Falling back to the default generator'
            cmake -S . -B build
            if ($LASTEXITCODE -ne 0) { throw 'CMake could not configure the project.' }
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "The build failed with $LASTEXITCODE" }

      - name: Build the installer
        id: installer
        shell: pwsh
        working-directory: installer
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          # A single-config generator puts the exe straight in build/, a
          # multi-config one in build/Release. Take whichever exists.
          $exe = Get-ChildItem -Path ..\build -Filter DisplayMirror.exe -Recurse |
                 Select-Object -First 1
          if (-not $exe) { throw 'DisplayMirror.exe was not found in the build output.' }
          Write-Host "Packaging $($exe.FullName)"
          & $makensis /DAPP_VERSION=${{ steps.version.outputs.version }} `
                      /DAPP_EXE=$($exe.FullName) `
                      /DOUT_FILE=..\DisplayMirror-Setup.exe `
                      DisplayMirror.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # tag_name is passed explicitly so a manual run creates the tag itself.
      # Pushing a tag is not something every caller of this workflow can do.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DisplayMirror ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            DisplayMirror-Setup.exe
            ${{ steps.installer.outputs.exe }}
