# Builds a release and publishes it, which is what the in-app update check
# looks at. Runs when a v* tag is pushed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            # A manual run has no v* tag; fall back to what the source says.
            $version = (Select-String -Path src/version.h -Pattern 'DM_VERSION_STRING L"([^"]+)"').Matches[0].Groups[1].Value
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # An update the program cannot recognise as installed would be offered
      # again on every check, so the tag and the built-in version must agree.
      - name: Check the version in the source matches the tag
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $actual = (Select-String -Path src/version.h -Pattern 'DM_VERSION_STRING L"([^"]+)"').Matches[0].Groups[1].Value
          if ($actual -ne $expected) {
            throw "src/version.h says $actual but the tag says $expected. Bump src/version.h, src/app.rc and installer/DisplayMirror.nsi first."
          }

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Build the installer
        shell: pwsh
        working-directory: installer
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          & $makensis /DAPP_VERSION=${{ steps.version.outputs.version }} `
                      /DAPP_EXE=..\build\Release\DisplayMirror.exe `
                      /DOUT_FILE=..\DisplayMirror-Setup.exe `
                      DisplayMirror.nsi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: DisplayMirror ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            DisplayMirror-Setup.exe
            build/Release/DisplayMirror.exe
